version: '3.8'

services:
  orchestrator:
    build:
      context: ./orchestrator
    container_name: orchestrator
    ports:
      - "${PORT_ORCHESTRATOR_API}:${PORT_ORCHESTRATOR_API}"
    environment:
      - SERVICE_PORT=${PORT_ORCHESTRATOR_API}
      - SERVICE_TOKEN=${ORCHESTRATOR_TOKEN}
      - EXTRACTOR_TOKEN=${EXTRACTOR_TOKEN}
      - LLM_LED_TOKEN=${LLM_LED_TOKEN}
      - LLM_DEEPANALYZE_TOKEN=${LLM_DEEPANALYZE_TOKEN}
      - EXTRACTOR_URL=http://extractor_service:${PORT_EXTRACTOR_API}
      - LLM_LED_URL=http://llm_service_led:${PORT_LLM_LED_API}
      - LLM_DEEPANALYZE_URL=http://llm_service_qwen:${PORT_LLM_QWEN_API}
      - IDENTIFIER_PATH_MODEL=${IDENTIFIER_PATH_MODEL}
      - IDENTIFIER_PATH_VECTORIZER=${IDENTIFIER_PATH_VECTORIZER}
      - IDENTIFIER_PATH_LABEL_ENCODER=${IDENTIFIER_PATH_LABEL_ENCODER}
      - SUBJECT_IDENTIFIER_PATH_CLASSIFIER=${SUBJECT_IDENTIFIER_PATH_CLASSIFIER}
      - SUBJECT_IDENTIFIER_PATH_VECTORIZER=${SUBJECT_IDENTIFIER_PATH_VECTORIZER}
      - SUBJECT_IDENTIFIER_PATH_LABEL_ENCODER=${SUBJECT_IDENTIFIER_PATH_LABEL_ENCODER}
      - TFIDF_VECTORIZER_PATH=app/models/tfidf_vectorizer.pkl
    depends_on:
      - extractor_service
      - llm_service_led

  extractor_service:
    build:
      context: ./extractor_service
    container_name: extractor_service
    ports:
      - "${PORT_EXTRACTOR_API}:${PORT_EXTRACTOR_API}"
    environment:
      - SERVICE_PORT=${PORT_EXTRACTOR_API}
      - SERVICE_TOKEN=${EXTRACTOR_TOKEN}

  llm_service_led:
    build:
      context: ./llm_service
    container_name: llm_service_led
    ports:
      - "${PORT_LLM_LED_API}:${PORT_LLM_LED_API}"
    environment:
      - SERVICE_PORT=${PORT_LLM_LED_API}
      - SERVICE_TOKEN=${LLM_LED_TOKEN}
      - IS_LOCAL_MODEL=${IS_LOCAL_MODEL1}
      - IS_OLLAMA_MODEL=${IS_OLLAMA_MODEL1}
      - MODEL_SELECTED=${MODEL_SELECTED_SERVICE1}
      - MODEL_PATH=${MODEL_PATH_SERVICE1}
      - MAX_TOKENS_INPUT=${MAX_TOKENS_INPUT_SERVICE1}
      - MAX_TOKENS_OUTPUT=${MAX_TOKENS_OUTPUT_SERVICE1}
      - TRUNACTION=${TRUNACTION_SERVICE1}
      - SPECIAL_TOKENS_TREATMENT=${SPECIAL_TOKENS_TREATMENT_SERVICE1}
      - ERRORS_TREATMENT=${ERRORS_TREATMENT_SERVICE1}
      - QUANTIZATION=${QUANTIZATION_SERVICE1}
    volumes:
      - ./models:/models

  llm_service_qwen:
    build:
      context: ./llm_service
    container_name: llm_service_qwen
    ports:
      - "${PORT_LLM_QWEN_API}:${PORT_LLM_QWEN_API}"
    environment:
      - SERVICE_PORT=${PORT_LLM_QWEN_API}
      - SERVICE_TOKEN=${LLM_DEEPANALYZE_TOKEN}
      - IS_LOCAL_MODEL=${IS_LOCAL_MODEL2}
      - IS_OLLAMA_MODEL=${IS_OLLAMA_MODEL2}
      - MODEL_SELECTED=${MODEL_SELECTED_SERVICE2}
      - OLLAMA_HOST_URL=${OLLAMA_HOST_URL}
    profiles:
      - qwen

  # ---------------------------------------------------------------------------
  # MCP Servers
  # ---------------------------------------------------------------------------

  mcp_orchestrator:
    build:
      context: ../mcp/orchestrator_mcp
    container_name: mcp_orchestrator
    ports:
      - "${PORT_MCP_ORCHESTRATOR}:${PORT_MCP_ORCHESTRATOR}"
    environment:
      - PORT_MCP_ORCHESTRATOR=${PORT_MCP_ORCHESTRATOR}
      - ORCHESTRATOR_URL=http://orchestrator:${PORT_ORCHESTRATOR_API}
      - ORCHESTRATOR_TOKEN=${ORCHESTRATOR_TOKEN}
    volumes:
      - ${MCP_DOCUMENTS_DIR:-./documents}:${MCP_DOCUMENTS_CONTAINER_DIR:-/documents}:ro
    depends_on:
      - orchestrator

  mcp_extractor:
    build:
      context: ../mcp/extractor_mcp
    container_name: mcp_extractor
    ports:
      - "${PORT_MCP_EXTRACTOR}:${PORT_MCP_EXTRACTOR}"
    environment:
      - PORT_MCP_EXTRACTOR=${PORT_MCP_EXTRACTOR}
      - EXTRACTOR_URL=http://extractor_service:${PORT_EXTRACTOR_API}
      - EXTRACTOR_TOKEN=${EXTRACTOR_TOKEN}
    depends_on:
      - extractor_service

  mcp_llm_led:
    build:
      context: ../mcp/llm_led_mcp
    container_name: mcp_llm_led
    ports:
      - "${PORT_MCP_LLM_LED}:${PORT_MCP_LLM_LED}"
    environment:
      - PORT_MCP_LLM_LED=${PORT_MCP_LLM_LED}
      - LLM_LED_URL=http://llm_service_led:${PORT_LLM_LED_API}
      - LLM_LED_TOKEN=${LLM_LED_TOKEN}
    depends_on:
      - llm_service_led
